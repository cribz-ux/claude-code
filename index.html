<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 20px; font-size: 1.5rem; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  input[type="number"] {
    width: 100%;
    font-size: 1.25rem;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
  }
  .tips { display: flex; gap: 8px; }
  .tips button {
    flex: 1;
    font-size: 1rem;
    padding: 12px 0;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
  }
  .tips button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .results {
    margin-top: 24px;
    padding: 16px;
    background: #eff6ff;
    border-radius: 12px;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; }
  .row.big { font-size: 1.25rem; font-weight: 700; border-top: 1px solid #bfdbfe; margin-top: 6px; padding-top: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #f9fafb; }
    main { background: #1f2937; }
    input[type="number"], .tips button { background: #111827; color: #f9fafb; border-color: #374151; }
    .results { background: #1e3a8a; }
    .row.big { border-color: #3b82f6; }
  }
</style>
</head>
<body>
<main>
  <h1>Tip Calculator</h1>

  <label for="bill">Bill amount</label>
  <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">

  <label>Tip</label>
  <div class="tips" id="tips">
    <button data-tip="10">10%</button>
    <button data-tip="15">15%</button>
    <button data-tip="18" class="active">18%</button>
    <button data-tip="20">20%</button>
  </div>

  <label for="people">Split between</label>
  <input id="people" type="number" inputmode="numeric" min="1" step="1" value="1">

  <div class="results">
    <div class="row"><span>Tip</span><span id="tipAmount">$0.00</span></div>
    <div class="row"><span>Total</span><span id="total">$0.00</span></div>
    <div class="row big"><span>Each person pays</span><span id="each">$0.00</span></div>
  </div>
</main>

<script>
  const bill = document.getElementById("bill");
  const people = document.getElementById("people");
  const tips = document.getElementById("tips");
  let tipPercent = 18;

  const money = (n) => "$" + n.toFixed(2);

  function update() {
    const b = parseFloat(bill.value) || 0;
    const p = Math.max(1, parseInt(people.value, 10) || 1);
    const tip = b * tipPercent / 100;
    const total = b + tip;
    document.getElementById("tipAmount").textContent = money(tip);
    document.getElementById("total").textContent = money(total);
    document.getElementById("each").textContent = money(total / p);
  }

  tips.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    tipPercent = Number(e.target.dataset.tip);
    tips.querySelectorAll("button").forEach((btn) => btn.classList.toggle("active", btn === e.target));
    update();
  });
  bill.addEventListener("input", update);
  people.addEventListener("input", update);
  update();
</script>
</body>
</html>
